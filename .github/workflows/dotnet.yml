name: .NET Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.0.301

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.nuget/packages
          **/bin
          **/obj
        key: ${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj') }}

    - name: Restore dependencies
      run: dotnet restore src/MineCase.sln

    - name: Build
      run: dotnet build src/MineCase.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test src/MineCase.sln --configuration Release --no-build --verbosity normal
